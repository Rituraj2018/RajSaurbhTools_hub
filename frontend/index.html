<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolix</title>
  <meta name="description"
    content="Production-ready document, photo, and PDF processing platform powered by the MERN Stack." />
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="min-h-screen font-['Plus_Jakarta_Sans',sans-serif] antialiased">
  <script>
    // Restore saved theme before first paint to prevent flash
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
