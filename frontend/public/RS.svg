<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Gradient for R -->
    <linearGradient id="accentGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Gradient for S -->
    <linearGradient id="accentGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle with Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Subtle Accent Glow -->
  <circle cx="256" cy="256" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Monogram RS -->
  <g filter="url(#glow)">
    <!-- Letter R -->
    <path d="M 130 140 
             L 215 140 
             C 255 140 275 160 275 195 
             C 275 230 255 248 215 250 
             L 278 372 
             L 225 372 
             L 172 265 
             L 172 372 
             L 130 372 
             Z 
             M 172 176 
             L 172 226 
             L 210 226 
             C 230 226 238 216 238 201 
             C 238 186 230 176 210 176 
             Z" 
          fill="url(#accentGradR)" />

    <!-- Letter S -->
    <path d="M 368 182 
             L 332 195 
             C 328 178 316 168 296 168 
             C 276 168 264 178 264 192 
             C 264 207 276 215 306 225 
             C 346 238 374 254 374 290 
             C 374 336 338 360 290 360 
             C 246 360 220 336 214 300 
             L 252 288 
             C 256 310 270 322 292 322 
             C 314 322 328 310 328 294 
             C 328 276 312 267 282 257 
             C 244 244 220 228 220 195 
             C 220 156 252 132 296 132 
             C 338 132 362 154 368 182 
             Z" 
          fill="url(#accentGradS)" />
  </g>

  <!-- Modern Sparkle / Tech Accent Dot -->
  <circle cx="376" cy="144" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="136" cy="368" r="6" fill="#a855f7" filter="url(#glow)" />
</svg>
